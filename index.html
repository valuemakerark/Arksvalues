<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huge Pets Database & Calculator</title>
    <style>
        :root {
            /* Dark Theme (Default) */
            --bg-color: #0b0c10;
            --surface: rgba(20, 22, 30, 0.8);
            --surface-hover: rgba(35, 38, 50, 0.9);
            --text-main: #ffffff;
            --text-muted: #8b8d98;
            --accent: #38bdf8;
            --rising: #10b981;
            --stable: #64748b;
            --win: #10b981;
            --loss: #ef4444;
            --border: #2a2d3d;
            --grid-line: rgba(255, 255, 255, 0.03);
            --trade-bg: rgba(0, 0, 0, 0.4);
            --active-glow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        [data-theme="light"] {
            /* Light Theme */
            --bg-color: #f1f5f9;
            --surface: rgba(255, 255, 255, 0.9);
            --surface-hover: rgba(240, 244, 248, 1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --rising: #059669;
            --stable: #94a3b8;
            --border: #cbd5e1;
            --grid-line: rgba(0, 0, 0, 0.04);
            --trade-bg: rgba(226, 232, 240, 0.5);
            --active-glow: 0 0 15px rgba(37, 99, 235, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
            transition: background-color 0.3s, color 0.3s;
            /* Hexagonal / Cube geometric background pattern */
            background-image: 
                linear-gradient(30deg, var(--grid-line) 12%, transparent 12.5%, transparent 87%, var(--grid-line) 87.5%, var(--grid-line)),
                linear-gradient(150deg, var(--grid-line) 12%, transparent 12.5%, transparent 87%, var(--grid-line) 87.5%, var(--grid-line)),
                linear-gradient(30deg, var(--grid-line) 12%, transparent 12.5%, transparent 87%, var(--grid-line) 87.5%, var(--grid-line)),
                linear-gradient(150deg, var(--grid-line) 12%, transparent 12.5%, transparent 87%, var(--grid-line) 87.5%, var(--grid-line)),
                linear-gradient(60deg, var(--grid-line) 25%, transparent 25.5%, transparent 75%, var(--grid-line) 75%, var(--grid-line)),
                linear-gradient(60deg, var(--grid-line) 25%, transparent 25.5%, transparent 75%, var(--grid-line) 75%, var(--grid-line));
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
        }

        /* Header */
        header {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-tabs { display: flex; gap: 15px; }
        .nav-tab {
            font-size: 12px; font-weight: bold; color: var(--text-muted);
            text-transform: uppercase; cursor: pointer; padding: 8px 12px;
            border-radius: 8px; transition: 0.2s;
        }
        .nav-tab.active { color: var(--accent); background: rgba(128, 128, 128, 0.1); }
        
        .theme-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-main);
            border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }

        /* Main Container & Search */
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .search-bar {
            width: 100%; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-main); font-size: 14px; outline: none;
            margin-bottom: 20px; transition: 0.2s;
        }
        .search-bar:focus { border-color: var(--accent); }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; cursor: pointer; transition: 0.1s; display: flex; flex-direction: column;
        }
        .card:active { transform: scale(0.96); }
        .card:hover { border-color: var(--accent); }
        
        .card-img { height: 90px; background: var(--trade-bg); border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px;}
        .card-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; flex-grow: 1; }
        .stat { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; color: var(--text-muted); }
        .stat-val { color: var(--text-main); font-weight: bold; }
        .trend-rising { color: var(--rising); font-size: 10px; font-weight: bold; }
        .trend-stable { color: var(--stable); font-size: 10px; font-weight: bold; }

        /* Cosmic Style Calculator */
        .trade-arena { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .trade-box {
            background: var(--surface); border: 2px solid var(--border); border-radius: 12px;
            padding: 15px; min-height: 120px; cursor: pointer; transition: 0.2s;
        }
        .trade-box.active-side { border-color: var(--accent); box-shadow: var(--active-glow); }
        .trade-box h3 { font-size: 14px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
        .trade-box h3 span { color: var(--text-main); font-weight: bold; }
        
        .trade-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .trade-item {
            background: var(--trade-bg); border: 1px solid var(--border); border-radius: 6px;
            padding: 5px 8px; font-size: 11px; display: flex; align-items: center; gap: 5px;
            animation: fadeIn 0.2s;
        }
        .trade-item:active { transform: scale(0.9); }
        .remove-icon { color: var(--loss); font-weight: bold; }

        .trade-result-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; text-align: center; font-size: 20px; font-weight: bold;
            display: flex; flex-direction: column; justify-content: center;
        }
        .diff-text { font-size: 12px; font-weight: normal; margin-top: 5px; color: var(--text-muted); }

        /* Contributors */
        .contrib-box { text-align: center; padding: 40px 20px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
        .contrib-names { font-size: 24px; font-weight: bold; color: var(--accent); margin-top: 15px; }

        @media (min-width: 768px) {
            .trade-arena { flex-direction: row; }
            .trade-box { flex: 1; }
            .trade-result-box { width: 200px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('database')">Database</div>
            <div class="nav-tab" onclick="switchTab('calculator')">Calculator</div>
            <div class="nav-tab" onclick="switchTab('contributors')">Credits</div>
        </div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
    </header>

    <div class="container">
        <!-- DATABASE SECTION -->
        <div id="database" class="section active">
            <input type="text" class="search-bar" id="dbSearch" placeholder="Search database...">
            <div class="grid" id="dbGrid"></div>
        </div>

        <!-- CALCULATOR SECTION -->
        <div id="calculator" class="section">
            <div class="trade-arena">
                <div class="trade-box active-side" id="box-my" onclick="setActiveSide('my')">
                    <h3>Your Offer <span><span id="myTotal">0</span></span></h3>
                    <div class="trade-items" id="myItems"></div>
                </div>
                
                <div class="trade-result-box" id="tradeResult">
                    <div>FAIR</div>
                    <div class="diff-text">Add pets to begin</div>
                </div>

                <div class="trade-box" id="box-their" onclick="setActiveSide('their')">
                    <h3>Their Offer <span><span id="theirTotal">0</span></span></h3>
                    <div class="trade-items" id="theirItems"></div>
                </div>
            </div>

            <input type="text" class="search-bar" id="calcSearch" placeholder="Search pets to add to trade...">
            <div class="grid" id="calcGrid"></div>
        </div>

        <!-- CONTRIBUTORS SECTION -->
        <div id="contributors" class="section">
            <div class="contrib-box">
                <h2 style="color: var(--text-main)">Special Thanks</h2>
                <p style="color: var(--text-muted); margin-top: 10px; font-size: 14px;">This database and calculator wouldn't be possible without the hard work of our contributors.</p>
                <div class="contrib-names">Tater & Ark</div>
            </div>
        </div>
    </div>

    <script>
        // Audio Setup (Clean electronic pops)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'tap') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.start(); osc.stop(audioCtx.currentTime + 0.04);
            } else if (type === 'remove') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.start(); osc.stop(audioCtx.currentTime + 0.06);
            }
        }

        // Add sound to all clicks safely
        document.addEventListener('click', () => {
            if (!audioCtx) audioCtx = new AudioContext();
        });

        // Theme Toggle
        let isDark = true;
        function toggleTheme() {
            playSound('tap');
            isDark = !isDark;
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
        }

        // Pet Data
        const rawPets = [
            { name: "Huge Basket Nightmare Cat", exist: "7", valueStr: "115M", val: 115000000 },
            { name: "Huge Starlight Hamster", exist: "9", valueStr: "69M", val: 69000000 },
            { name: "Huge Mining Kraken", exist: "9", valueStr: "8.5M", val: 8500000 },
            { name: "Huge Shadow Sphinx", exist: "46", valueStr: "750K", val: 750000 },
            { name: "Huge Empyrean Scorpion", exist: "6", valueStr: "19M", val: 19000000 },
            { name: "Huge Hellish Dominus", exist: "10", valueStr: "15M", val: 15000000 },
            { name: "Huge Easter Chest Mimic", exist: "16", valueStr: "6M", val: 6000000 },
            { name: "Huge Painted Bunny", exist: "5", valueStr: "13.5M", val: 13500000 },
            { name: "Huge Sensei Cat", exist: "8", valueStr: "15.5M", val: 15500000 },
            { name: "Huge Kaiju bear", exist: "10", valueStr: "10M", val: 10000000 },
            { name: "Huge Broken Mining Robot", exist: "6", valueStr: "21.5M", val: 21500000 },
            { name: "Huge Abyss Agony", exist: "108", valueStr: "765K", val: 765000 },
            { name: "Huge Onyx Gem Golem", exist: "5", valueStr: "66M", val: 66000000 },
            { name: "Huge Obsidian Butterfly", exist: "15", valueStr: "6.5M", val: 6500000 },
            { name: "Huge Nyan Dog", exist: "18", valueStr: "6.5M", val: 6500000 },
            { name: "Huge Gift Mining Cat", exist: "14", valueStr: "8M", val: 8000000 },
            { name: "Huge Dominus Minecart Astra", exist: "10", valueStr: "O/C", val: 0 },
            { name: "Huge Release Penguin", exist: "11", valueStr: "7M", val: 7000000 },
            { name: "Huge Abstract Cat", exist: "25", valueStr: "3M", val: 3000000 },
            { name: "Huge Raingelus", exist: "24", valueStr: "3.2M", val: 3200000 },
            { name: "Huge Blueberry Kitsune", exist: "?", valueStr: "7M", val: 7000000 },
            { name: "Huge Doom Bunny", exist: "94", valueStr: "600K", val: 600000 },
            { name: "Huge Celestial Wolf", exist: "60", valueStr: "1.3M", val: 1300000 },
            { name: "Huge Sun Fox", exist: "44", valueStr: "1.9M", val: 1900000 },
            { name: "Huge Terror Slime Mech Cat", exist: "50", valueStr: "1.75M", val: 1750000 },
            { name: "Huge Abyss Dragon", exist: "12", valueStr: "17.5M", val: 17500000 },
            { name: "Huge Crystal Pegasus", exist: "4", valueStr: "50M", val: 50000000 },
            { name: "Huge Gubert", exist: "6", valueStr: "40M", val: 40000000 },
            { name: "Huge Plasma Axolotl", exist: "36", valueStr: "2.7M", val: 2700000 },
            { name: "Huge Creepy Raccoon", exist: "48", valueStr: "1.85M", val: 1850000 },
            { name: "Huge Old Archangel Kangaroo", exist: "22", valueStr: "4.5M", val: 4500000 },
            { name: "Huge Tech Samurai Kitsune", exist: "19", valueStr: "5M", val: 5000000 },
            { name: "Huge Pixel Archgelus", exist: "10", valueStr: "18M", val: 18000000 },
            { name: "Huge Super Coral Dragon", exist: "16", valueStr: "6M", val: 6000000 },
            { name: "Huge Super Coral Dominus", exist: "2", valueStr: "O/C", val: 0 },
            { name: "Huge Ghostface Floppa", exist: "5", valueStr: "75M", val: 75000000 }
        ];

        // Assign Rising Status explicitly
        const risingNames = ["Huge Onyx Gem Golem", "Huge Basket Nightmare Cat", "Huge Starlight Hamster", "Huge Ghostface Floppa"];
        
        let allPets = rawPets.map(pet => {
            pet.isRising = risingNames.includes(pet.name);
            return pet;
        });

        // Sort: Rising at the Top, then by Value
        allPets.sort((a, b) => {
            if (a.isRising && !b.isRising) return -1;
            if (!a.isRising && b.isRising) return 1;
            return b.val - a.val; // Highest value first
        });

        // Format Numbers
        function formatNumber(num) {
            if (num === 0) return "O/C";
            if (num >= 1000000) return (num / 1000000).toFixed(1).replace('.0', '') + 'M';
            if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
            return num;
        }

        // Render Grids
        function renderGrid(containerId, filterText = '', isCalculator = false) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            
            const filtered = allPets.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()));

            filtered.forEach((pet, index) => {
                const trendHtml = pet.isRising ? `<span class="trend-rising">▲ RISING</span>` : `<span class="trend-stable">● STABLE</span>`;
                // If it's the calculator grid, clicking adds to trade. Otherwise, just a visual card.
                const clickAction = isCalculator ? `onclick="addToTrade('${pet.name}')"` : '';
                
                // Get original index for reference if needed, but we can just pass name
                grid.innerHTML += `
                    <div class="card" ${clickAction}>
                        <div class="card-img">🐾</div>
                        <div class="card-title">${pet.name}</div>
                        <div class="stat"><span>Value</span> <span class="stat-val">${pet.valueStr}</span></div>
                        <div class="stat"><span>Exists</span> <span class="stat-val">${pet.exist}</span></div>
                        <div class="stat" style="margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px;">
                            ${trendHtml}
                        </div>
                    </div>
                `;
            });
        }

        // Tab Switching
        function switchTab(tabId) {
            playSound('tap');
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Search Listeners
        document.getElementById('dbSearch').addEventListener('input', (e) => renderGrid('dbGrid', e.target.value, false));
        document.getElementById('calcSearch').addEventListener('input', (e) => renderGrid('calcGrid', e.target.value, true));


        // --- COSMIC CALCULATOR LOGIC ---
        let activeSide = 'my'; // 'my' or 'their'
        let myTrade = [];
        let theirTrade = [];

        function setActiveSide(side) {
            playSound('tap');
            activeSide = side;
            document.getElementById('box-my').classList.remove('active-side');
            document.getElementById('box-their').classList.remove('active-side');
            document.getElementById(`box-${side}`).classList.add('active-side');
        }

        function addToTrade(petName) {
            playSound('tap');
            const pet = allPets.find(p => p.name === petName);
            if (activeSide === 'my') myTrade.push(pet);
            else theirTrade.push(pet);
            updateTradeUI();
        }

        function removeFromTrade(side, index) {
            playSound('remove');
            if (side === 'my') myTrade.splice(index, 1);
            else theirTrade.splice(index, 1);
            updateTradeUI();
            event.stopPropagation(); // Prevent triggering setActiveSide
        }

        function updateTradeUI() {
            let mySum = 0;
            document.getElementById('myItems').innerHTML = myTrade.map((p, i) => {
                mySum += p.val; 
                return `<div class="trade-item" onclick="removeFromTrade('my', ${i})">${p.name} <span class="remove-icon">×</span></div>`;
            }).join('');
            document.getElementById('myTotal').innerText = formatNumber(mySum);

            let theirSum = 0;
            document.getElementById('theirItems').innerHTML = theirTrade.map((p, i) => {
                theirSum += p.val; 
                return `<div class="trade-item" onclick="removeFromTrade('their', ${i})">${p.name} <span class="remove-icon">×</span></div>`;
            }).join('');
            document.getElementById('theirTotal').innerText = formatNumber(theirSum);

            // Calculate Result
            const resBox = document.getElementById('tradeResult');
            if (mySum === 0 && theirSum === 0) {
                resBox.innerHTML = `<div>FAIR</div><div class="diff-text">Add pets to begin</div>`;
                resBox.style.color = "var(--text-main)";
            } else if (mySum < theirSum) {
                const diff = formatNumber(theirSum - mySum);
                resBox.innerHTML = `<div>WIN</div><div class="diff-text" style="color: var(--win)">+${diff} Value</div>`;
                resBox.style.color = "var(--win)";
            } else if (mySum > theirSum) {
                const diff = formatNumber(mySum - theirSum);
                resBox.innerHTML = `<div>LOSS</div><div class="diff-text" style="color: var(--loss)">-${diff} Value</div>`;
                resBox.style.color = "var(--loss)";
            } else {
                resBox.innerHTML = `<div>FAIR</div><div class="diff-text">Equal Value</div>`;
                resBox.style.color = "var(--text-main)";
            }
        }

        // Init
        renderGrid('dbGrid', '', false);
        renderGrid('calcGrid', '', true);
    </script>
</body>
</html>
